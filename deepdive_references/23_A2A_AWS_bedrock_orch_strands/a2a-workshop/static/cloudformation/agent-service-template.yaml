AWSTemplateFormatVersion: '2010-09-09'
Description: 'A2A Workshop - Reusable Agent Service Template'

################################################################################
# This template deploys a domain agent ECS service.
#
# Domain agents are Tier 3 services that:
#   - Provide specialized capabilities (weather, events, restaurants, etc.)
#   - Are discoverable via CloudMap
#   - Are accessible only privately (no ALB exposure)
#
# Prerequisites:
#   - agent-resources-template.yaml must be deployed first (creates ECR + logs)
#
# Deployment: ./scripts/deploy-agent.sh <agent-name> (Step 3)
################################################################################

Parameters:
  ProjectName:
    Type: String
    Default: a2a
    Description: Project name for resource naming (must match infrastructure stack)

  Environment:
    Type: String
    Default: workshop
    AllowedValues:
      - workshop
      - dev
      - prod
    Description: Environment name (must match infrastructure stack)

  AgentName:
    Type: String
    Description: Agent name (e.g., weather-agent, events-agent, restaurant-agent)
    AllowedPattern: '[a-z][a-z0-9-]*'
    ConstraintDescription: Must be lowercase letters, numbers, and hyphens only

  AgentType:
    Type: String
    Description: Agent type for AGENT_TYPE environment variable (e.g., weather-agent)
    AllowedPattern: '[a-z][a-z0-9-]*'

  AgentPort:
    Type: Number
    Default: 8000
    Description: Port the agent listens on (all agents use port 8000)
    AllowedValues:
      - 8000

  ContainerImage:
    Type: String
    Description: Docker image URI from ECR (leave blank to use default)
    Default: ''

  ContainerCpu:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024', '2048']
    Description: Task CPU units (256 = 0.25 vCPU, 512 = 0.5 vCPU)

  ContainerMemory:
    Type: String
    Default: '1024'
    AllowedValues: ['512', '1024', '2048', '4096']
    Description: Task memory in MB

  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 3
    Description: Number of tasks to run (0 = stopped)

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
    Description: Log level for the agent service

Conditions:
  HasContainerImage: !Not [!Equals [!Ref ContainerImage, '']]

Resources:
  #############################################################################
  # CloudMap Service Registration
  #############################################################################

  CloudMapService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: !Ref AgentName
      Description: !Sub 'Service discovery for ${AgentName}'
      NamespaceId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-namespace-id'
      # Note: HTTP namespaces don't use DnsConfig - discovery is via API only
      Tags:
        - Key: Name
          Value: !Ref AgentName
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  #############################################################################
  # ECS Task Definition
  #############################################################################

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${AgentName}'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref ContainerCpu
      Memory: !Ref ContainerMemory
      ExecutionRoleArn:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-ecs-execution-role-arn'
      TaskRoleArn:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-ecs-task-role-arn'
      ContainerDefinitions:
        - Name: !Ref AgentName
          Image: !If
            - HasContainerImage
            - !Ref ContainerImage
            - !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-${Environment}/${AgentName}:latest'
          Essential: true
          PortMappings:
            - ContainerPort: !Ref AgentPort
              Protocol: tcp
          Environment:
            - Name: AGENT_TYPE
              Value: !Ref AgentType
            - Name: AGENT_PORT
              Value: !Ref AgentPort
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: CLOUDMAP_NAMESPACE
              Value:
                Fn::ImportValue: !Sub '${ProjectName}-${Environment}-namespace-name'
            - Name: CLOUDMAP_NAMESPACE_ID
              Value:
                Fn::ImportValue: !Sub '${ProjectName}-${Environment}-namespace-id'
            - Name: PROJECT_NAME
              Value: !Ref ProjectName
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: LOG_LEVEL
              Value: !Ref LogLevel
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub '${ProjectName}-${Environment}-${AgentName}-log-group'
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: !Ref AgentName
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub 'curl -f http://localhost:${AgentPort}/health || exit 1'
            Interval: 90
            Timeout: 10
            Retries: 3
            StartPeriod: 60
      Tags:
        - Key: Name
          Value: !Sub '${AgentName}-task'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Agent
          Value: !Ref AgentName

  #############################################################################
  # ECS Service
  #############################################################################

  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${ProjectName}-${AgentName}'
      Cluster:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-cluster-name'
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-public-subnet-1-id'
            - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-public-subnet-2-id'
          SecurityGroups:
            - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-ecs-task-sg-id'
      ServiceRegistries:
        - RegistryArn: !GetAtt CloudMapService.Arn
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      Tags:
        - Key: Name
          Value: !Sub '${AgentName}-service'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Agent
          Value: !Ref AgentName

#############################################################################
# Outputs
#############################################################################

Outputs:
  CloudMapServiceId:
    Description: CloudMap service ID
    Value: !GetAtt CloudMapService.Id
    Export:
      Name: !Sub '${ProjectName}-${Environment}-${AgentName}-cloudmap-id'

  CloudMapServiceArn:
    Description: CloudMap service ARN
    Value: !GetAtt CloudMapService.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-${AgentName}-cloudmap-arn'

  CloudMapServiceName:
    Description: CloudMap service name (for agent discovery)
    Value: !Ref AgentName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-${AgentName}-cloudmap-name'

  ECSServiceName:
    Description: ECS service name
    Value: !GetAtt ECSService.Name
    Export:
      Name: !Sub '${ProjectName}-${Environment}-${AgentName}-service-name'

  ECSServiceArn:
    Description: ECS service ARN
    Value: !Ref ECSService
    Export:
      Name: !Sub '${ProjectName}-${Environment}-${AgentName}-service-arn'

  TaskDefinitionArn:
    Description: Task definition ARN
    Value: !Ref TaskDefinition
    Export:
      Name: !Sub '${ProjectName}-${Environment}-${AgentName}-task-arn'
