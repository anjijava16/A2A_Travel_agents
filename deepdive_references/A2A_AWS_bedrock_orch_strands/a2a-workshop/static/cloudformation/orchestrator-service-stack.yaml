AWSTemplateFormatVersion: '2010-09-09'
Description: 'A2A Workshop - Orchestrator Stack (Platform Service)'

################################################################################
# This template deploys the Travel Orchestrator ECS service.
#
# The orchestrator is a Tier 2 platform service that:
#   - Coordinates multi-agent workflows using Claude on Bedrock
#   - Discovers and invokes domain agents via CloudMap
#   - Is accessible only via CloudMap (no ALB exposure)
#
# Prerequisites:
#   - orchestrator-resources-stack.yaml must be deployed first (creates ECR + logs)
#
# Deployment: ./scripts/deploy-orchestrator.sh (Step 3)
################################################################################

Parameters:
  ProjectName:
    Type: String
    Default: a2a
    Description: Project name for resource naming (must match infrastructure stack)

  Environment:
    Type: String
    Default: workshop
    AllowedValues:
      - workshop
      - dev
      - prod
    Description: Environment name (must match infrastructure stack)

  ContainerImage:
    Type: String
    Description: Docker image URI from ECR (leave blank to use default)
    Default: ''

  ContainerCpu:
    Type: String
    Default: '1024'
    AllowedValues: ['256', '512', '1024', '2048']
    Description: Task CPU units (1024 = 1 vCPU)

  ContainerMemory:
    Type: String
    Default: '2048'
    AllowedValues: ['512', '1024', '2048', '4096']
    Description: Task memory in MB

  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 3
    Description: Number of tasks to run (0 = stopped)

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
    Description: Log level for the orchestrator service

Conditions:
  HasContainerImage: !Not [!Equals [!Ref ContainerImage, '']]

Resources:
  #############################################################################
  # CloudMap Service Registration (Private Discovery)
  #############################################################################

  CloudMapService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: orchestrator
      Description: 'Service discovery for Travel Orchestrator'
      NamespaceId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-namespace-id'
      Tags:
        - Key: Name
          Value: orchestrator
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  #############################################################################
  # ECS Task Definition
  #############################################################################

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-orchestrator'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref ContainerCpu
      Memory: !Ref ContainerMemory
      ExecutionRoleArn:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-ecs-execution-role-arn'
      TaskRoleArn:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-ecs-task-role-arn'
      ContainerDefinitions:
        - Name: orchestrator
          Image: !If
            - HasContainerImage
            - !Ref ContainerImage
            - !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-${Environment}/orchestrator:latest'
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: AGENT_TYPE
              Value: orchestrator
            - Name: AGENT_PORT
              Value: '8000'
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: CLOUDMAP_NAMESPACE
              Value:
                Fn::ImportValue: !Sub '${ProjectName}-${Environment}-namespace-name'
            - Name: CLOUDMAP_NAMESPACE_ID
              Value:
                Fn::ImportValue: !Sub '${ProjectName}-${Environment}-namespace-id'
            - Name: PROJECT_NAME
              Value: !Ref ProjectName
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: LOG_LEVEL
              Value: !Ref LogLevel
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub '${ProjectName}-${Environment}-orchestrator-log-group'
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: orchestrator
          HealthCheck:
            Command:
              - CMD-SHELL
              - 'curl -f http://localhost:8000/health || exit 1'
            Interval: 90
            Timeout: 10
            Retries: 3
            StartPeriod: 60
      Tags:
        - Key: Name
          Value: orchestrator-task
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  #############################################################################
  # ECS Service (CloudMap Only - No ALB)
  #############################################################################

  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${ProjectName}-orchestrator'
      Cluster:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-cluster-name'
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-public-subnet-1-id'
            - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-public-subnet-2-id'
          SecurityGroups:
            - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-ecs-task-sg-id'
      ServiceRegistries:
        - RegistryArn: !GetAtt CloudMapService.Arn
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      Tags:
        - Key: Name
          Value: orchestrator-service
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

#############################################################################
# Outputs
#############################################################################

Outputs:
  CloudMapServiceId:
    Description: CloudMap service ID
    Value: !GetAtt CloudMapService.Id
    Export:
      Name: !Sub '${ProjectName}-${Environment}-orchestrator-cloudmap-id'

  CloudMapServiceArn:
    Description: CloudMap service ARN
    Value: !GetAtt CloudMapService.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-orchestrator-cloudmap-arn'

  CloudMapServiceName:
    Description: CloudMap service name (for agent discovery)
    Value: orchestrator
    Export:
      Name: !Sub '${ProjectName}-${Environment}-orchestrator-cloudmap-name'

  ECSServiceName:
    Description: ECS service name
    Value: !GetAtt ECSService.Name
    Export:
      Name: !Sub '${ProjectName}-${Environment}-orchestrator-service-name'

  ECSServiceArn:
    Description: ECS service ARN
    Value: !Ref ECSService
    Export:
      Name: !Sub '${ProjectName}-${Environment}-orchestrator-service-arn'

  TaskDefinitionArn:
    Description: Task definition ARN
    Value: !Ref TaskDefinition
    Export:
      Name: !Sub '${ProjectName}-${Environment}-orchestrator-task-arn'
